<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#2E7CFF"/>
      <stop offset="100%" stop-color="#1450E0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1450E0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#FFFFFF"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="none" stroke="#F0F1F5" stroke-width="4"/>

  <g filter="url(#soft)" transform="translate(512,512)">
    <!-- ring + long checkmark arm as ONE continuous connected path -->
    <path d="M 172.0 120.4 A 210 210 0 1 1 120.4 -172.0 L 15 75"
          fill="none"
          stroke="url(#blueGrad)"
          stroke-width="105"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- short checkmark arm, meeting the vertex -->
    <path d="M -75 -5 L 15 75"
          fill="none"
          stroke="url(#blueGrad)"
          stroke-width="105"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>